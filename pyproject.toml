[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverlock"
version = "1.0.0"
description = "Content-bound image codes for watermark payload binding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "Pillow>=9.5",
  "tqdm>=4.65",
]

[project.scripts]
coverlock = "coverlock.cli:main"

[tool.setuptools.packages.find]
include = ["coverlock*"]

